<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;
const MM = 3.7795275591;
const POSTER_W_MM = 1400;
const POSTER_H_MM = 900;

const CARD_REGISTRY = {
  tldr: {
    title: <>Question &amp; TL;DR</>,
    color: null,
    grow: false,
    body: (
      <>
        <div className="hl"><p>Can <b>permissive-first</b> pretraining keep up with non-permissive web mixtures <i>after post-training</i>, if instruction &amp; reasoning data is <b>front-loaded</b> into pretraining?</p></div>
        <ul>
          <li><b>Yes, for math, code and reasoning.</b> Front-loading improves post-trained reasoning for <b>all four</b> pretraining datasets, and both enriched permissive mixtures lead the non-permissive ones at 16K.</li>
          <li><b>Pretraining decides how much a model gains from post-training.</b> With front-loading, reasoning SFT gives large gains. Without it, every mixture <span className="dn">declines</span>.</li>
          <li><b>One gap remains:</b> permissive mixtures still trail on general language understanding.</li>
        </ul>
      </>
    ),
  },
  setup: {
    title: <>Controlled setup</>,
    color: null,
    grow: true,
    body: (
      <>
        <div className="fig"><div className="fig-wrap"><img src="pipeline.png" alt="Post-training pipeline" /></div>
        </div>
        <ul>
          <li><b>1.7B models, 300B tokens</b>, same recipe, different pretraining data.</li>
          <li><b>Evaluation:</b> 11-task reasoning suite (math, code, science QA, IFEval) + language understanding suite.</li>
        </ul>
      </>
    ),
  },
  results: {
    title: <><span className="num">2</span>Post-training: Tulu3 SFT + DPO, then reasoning SFT</>,
    color: 'orange',
    grow: true,
    body: (
      <>
        <div className="hl o"><p>The same 30K-sample reasoning SFT (OpenThoughts3) gives large gains for every <b>front-loaded</b> model, and makes every model without front-loading <b>worse</b>.</p></div>
        <table className="combo">
          <thead>
            <tr className="grp"><th></th><th colSpan="3">Phase 1: Tulu3</th><th colSpan="3" className="p2">Phase 2: reasoning SFT</th></tr>
            <tr><th>Reasoning suite avg. (16K)</th><th>Base</th><th>SFT</th><th>DPO</th><th className="p2">SFT</th><th>+ Reas.</th><th>Δ</th></tr>
          </thead>
          <tbody>
            <tr className="sec"><td colSpan="7">Front-loaded · 300B tokens</td></tr>
            <tr><td><span className="mv">MixtureVitae</span> (perm.)</td><td className="best">29.1</td><td className="best">26.6</td><td className="best">26.9</td><td className="p2">23.4</td><td>34.1</td><td className="best">+10.7</td></tr>
            <tr><td><span className="cm">Comma0.1</span> (perm.)</td><td>27.5</td><td>25.3</td><td>25.4</td><td className="p2">22.2</td><td className="best">38.0</td><td className="best">+15.8</td></tr>
            <tr><td>Nemotron-CC-HQ</td><td>26.5</td><td>22.1</td><td>22.4</td><td className="p2">21.2</td><td>35.3</td><td className="best">+14.2</td></tr>
            <tr><td>FineWeb-Edu</td><td>26.0</td><td>22.2</td><td>21.8</td><td className="p2">20.0</td><td>33.3</td><td className="best">+13.3</td></tr>
            <tr className="sec"><td colSpan="7">Without front-loading · 300B tokens</td></tr>
            <tr><td><span className="cm">Comma0.1</span> (perm.)</td><td>11.1</td><td>11.7</td><td>12.0</td><td className="p2">11.5</td><td>7.5</td><td className="dn">−4.0</td></tr>
            <tr><td>Nemotron-CC-HQ</td><td>7.8</td><td>8.1</td><td>8.3</td><td className="p2">7.9</td><td>6.6</td><td className="dn">−1.3</td></tr>
            <tr><td>FineWeb-Edu</td><td>8.3</td><td>7.7</td><td>8.2</td><td className="p2">7.5</td><td>6.2</td><td className="dn">−1.3</td></tr>
            <tr className="sec"><td colSpan="7">External references · 11–36T tokens</td></tr>
            <tr><td>SmolLM2 1.7B</td><td>16.8</td><td>18.2</td><td>18.7</td><td className="p2">15.4</td><td>11.6</td><td className="dn">−3.8</td></tr>
            <tr><td>Qwen2.5 1.5B</td><td>9.9</td><td>23.4</td><td>24.7</td><td className="p2">23.6</td><td>22.9</td><td>−0.7</td></tr>
            <tr><td>Qwen3 1.7B</td><td>30.7</td><td>31.5</td><td>31.4</td><td className="p2">28.5</td><td>11.3</td><td className="dn">−17.2</td></tr>
          </tbody>
        </table>
        <div className="tnote">Phase 2 is scored with a longer reasoning generation budget (sampled, T = 0.7), so its SFT column differs from Phase 1.</div>
        <ul>
          <li>After Tulu3, <span className="mv">MV</span> has <b>more than 2×</b> the suite average of every matched-compute model without front-loading, and it trained on 37–120× fewer tokens than the external models.</li>
          <li><span className="mv">MV</span> goes from 23.4 to <b>34.1</b> (MATH500 <b>71.0</b>). The enriched <span className="cm">Comma0.1</span> reaches <b>38.0</b>.</li>
          <li>Within each dataset, front-loading adds <span className="up">+14.6 to +19.8</span> pts to the reasoning SFT gain.</li>
          <li>Models without front-loading produce very long outputs: 53–100% of their answers come close to the generation limit.</li>
          <li>The language average barely moves (<b>+0.2</b> pts for MV).</li>
        </ul>
      </>
    ),
  },
  factorial: {
    title: <><span className="num">1</span>Front-loading helps every pretraining dataset</>,
    color: null,
    grow: false,
    body: (
      <>
        <div className="hl"><p>Adding the instruction &amp; reasoning subset raises the post-trained reasoning suite average in <b>all 24</b> combinations of dataset × context × stage, by <span className="up">+9.8 to +20.1</span> points.</p></div>
        <ul>
          <li><b>Permissive mixtures become competitive.</b> When every mixture is enriched, both permissive datasets lead both non-permissive ones at 16K after SFT and after DPO, by <b>3.0–5.1 pts</b>.</li>
          <li><b>Tulu3 cannot substitute for pretraining.</b> Phase 1 makes front-loaded bases worse on reasoning.</li>
          <li><b>Reasoning SFT widens the gap</b>: front-loaded models gain, models without front-loading decline.</li>
          <li><b>One gap persists:</b> permissive datasets remain <span className="dn">5.5–9.6 pts</span> behind on the language understanding average.</li>
        </ul>
      </>
    ),
  },
  main: {
    title: <>Front-loading makes models receptive to post-training</>,
    color: null,
    grow: true,
    body: (
      <>
        <div className="fig"><div className="fig-wrap"><img src="stages.png" alt="Reasoning suite average across training stages, with and without front-loading" /></div>
        </div>
      </>
    ),
  },
  sensitivity: {
    title: <><span className="num">3</span>Sensitivity to pretraining data and SFT corpus</>,
    color: 'purple',
    grow: true,
    body: (
      <>
        <p><b>The gains do not depend on OpenThoughts3.</b> Three other reasoning datasets also give large MATH500 gains to MV, while the original reference mixtures barely move:</p>
        <div className="fig"><div className="fig-wrap"><img src="corpora_math500.png" alt="MATH500 gains across reasoning corpora" /></div>
        </div>
      </>
    ),
  },
  concl: {
    title: <>Takeaways</>,
    color: 'red',
    grow: false,
    body: (
      <>
        <ul>
          <li><b>Front-loading instruction &amp; reasoning data</b> makes strong post-training possible under a <b>permissive data constraint</b>.</li>
          <li><b>Compare pretraining mixtures after post-training</b>, both their endpoints and how they respond to further training. Base-model rankings can flip.</li>
          <li><b>Open problems:</b> closing the language understanding gap, and keeping instruction following through reasoning SFT.</li>
          <li><b>Limitations:</b> 1.7B scale only, no RL stage, and only a partial overlap audit. </li>
        </ul>
        <div className="links">
          <div className="ll"><b>Code, evals &amp; checkpoints:</b> <span style={{whiteSpace:"nowrap"}}>github.com/MixtureVitae/permissive-post-train</span></div>
        </div>
      </>
    ),
  },
};

const DEFAULT_LAYOUT = {
  columns: [
    { id: 'col1', widthMm: 420, cards: ['tldr', 'setup', 'factorial'] },
    { id: 'col2', widthMm: null, cards: ['main', 'results'] },

  ],
};
const DEFAULT_CARD_HEIGHTS = { main: 215 };
const DEFAULT_FONT_SCALE = 3.6;

const LOGO_BAR = [
  { src: 'logos/freiburg.png', alt: 'University of Freiburg', h: 16 },
  { src: 'logos/laion.png', alt: 'LAION', h: 21 },
  { src: 'logos/fzj.png', alt: 'Forschungszentrum Jülich / JSC', h: 24 },
  { src: 'logos/open-sci.png', alt: 'Open-Ψ (Open-Sci) Collective', h: 28 },
  { src: 'logos/openeurollm.png', alt: 'OpenEuroLLM', h: 29 },
  { src: 'logos/ontocord.png', alt: 'Ontocord', h: 27 },
  { src: 'logos/polytechnique.png', alt: 'École Polytechnique', h: 36 },
  { src: 'logos/ellis_tuebingen.png', alt: 'ELLIS Institute Tübingen', h: 17 },
];
const DEFAULT_LOGOS = [
  /* { src: 'logos/institution.png', alt: 'Institution', heightMm: 28 }, */
];

/* ================================================================
   FRAMEWORK CODE — generally don't need to modify below this line
   ================================================================ */

function cloneLayout(layout) {
  return { columns: layout.columns.map(c => ({ id: c.id, widthMm: c.widthMm, cards: [...c.cards] })) };
}

const LS_KEY = 'posterConfig-permissive-post-train';
function getFullConfig(layout, cardHeights, fontScale, logos) {
  return { columns: layout.columns, cardHeights, fontScale, logos };
}
function loadInitialConfig() {
  try { const s = localStorage.getItem(LS_KEY); if (s) return JSON.parse(s); } catch(e) {}
  return null;
}
const INIT_CONFIG = loadInitialConfig();

function PosterApp() {
  const [layout, setLayout] = useState(INIT_CONFIG ? cloneLayout({columns: INIT_CONFIG.columns}) : cloneLayout(DEFAULT_LAYOUT));
  const [selectedCard, setSelectedCard] = useState(null);
  const [cardHeights, setCardHeights] = useState(INIT_CONFIG?.cardHeights || {...DEFAULT_CARD_HEIGHTS});
  const [preview, setPreview] = useState(false);
  const [logos, setLogos] = useState(INIT_CONFIG?.logos || DEFAULT_LOGOS);
  const [fontScale, setFontScaleState] = useState(INIT_CONFIG?.fontScale || DEFAULT_FONT_SCALE);
  const currentScaleRef = useRef(1);
  const posterRef = useRef(null);

  useEffect(() => { const cfg = getFullConfig(layout, cardHeights, fontScale, logos); localStorage.setItem(LS_KEY, JSON.stringify(cfg)); }, [layout, cardHeights, fontScale, logos]);
  useEffect(() => { document.documentElement.style.setProperty('--font-scale', fontScale); }, [fontScale]);
  useEffect(() => { document.body.classList.toggle('preview', preview); }, [preview]);

  const fit = useCallback(() => {
    if (window.matchMedia('print').matches) return;
    const pW = POSTER_W_MM * MM, pH = POSTER_H_MM * MM;
    const scale = Math.min(window.innerWidth / pW, window.innerHeight / pH);
    currentScaleRef.current = scale;
    const left = (window.innerWidth - pW * scale) / 2;
    const top = (window.innerHeight - pH * scale) / 2;
    document.body.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + scale + ')';
  }, []);
  useEffect(() => { fit(); window.addEventListener('resize', fit); return () => window.removeEventListener('resize', fit); }, [fit]);

  useEffect(() => { if (typeof renderMathInElement === 'function') renderMathInElement(document.body, {delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]}); });

  useEffect(() => {
    function handler(e) { if (selectedCard && !e.target.closest('.swap-handle') && !e.target.closest('.drop-zone')) setSelectedCard(null); }
    document.addEventListener('click', handler); return () => document.removeEventListener('click', handler);
  }, [selectedCard]);

  function swapCards(id1, id2) {
    if (id1 === id2) return false;
    setLayout(prev => { const next = cloneLayout(prev); let l1, l2; for (const c of next.columns) { const i1 = c.cards.indexOf(id1); if (i1!==-1) l1={col:c,idx:i1}; const i2 = c.cards.indexOf(id2); if (i2!==-1) l2={col:c,idx:i2}; } if (!l1||!l2) return prev; l1.col.cards[l1.idx]=id2; l2.col.cards[l2.idx]=id1; return next; });
    setCardHeights(prev => { const n={...prev}; delete n[id1]; delete n[id2]; return n; });
    return true;
  }
  function moveCard(cardId, targetColId, position) {
    setLayout(prev => { const next = cloneLayout(prev); for (const c of next.columns) { const i = c.cards.indexOf(cardId); if (i!==-1) { c.cards.splice(i,1); break; } } const tc = next.columns.find(c=>c.id===targetColId); if (!tc) return prev; tc.cards.splice(Math.max(0,Math.min(position,tc.cards.length)),0,cardId); return next; });
    setCardHeights(prev => { const n={...prev}; delete n[cardId]; return n; });
  }
  function setColumnWidth(colId, widthMm) { setLayout(prev => { const next = cloneLayout(prev); const c = next.columns.find(c=>c.id===colId); if (!c) return prev; c.widthMm = widthMm; return next; }); }
  function setCardHeight(cardId, heightMm) { setCardHeights(prev => ({...prev, [cardId]: heightMm})); }
  function getWaste() { let total=0; const details=[]; document.querySelectorAll('.fig-wrap').forEach(fw => { const img=fw.querySelector('img'); if(!img)return; const fr=fw.getBoundingClientRect(),ir=img.getBoundingClientRect(); const wH=Math.abs(fr.height-ir.height),wW=Math.abs(fr.width-ir.width); total+=wH+wW; details.push({card:fw.closest('.card')?.dataset.id,wasteH:Math.round(wH),wasteW:Math.round(wW),pct:Math.round((wH+wW)/(fr.height+fr.width)*100)}); }); return {total:Math.round(total),details}; }
  function getLayout() { const s=currentScaleRef.current; const r=[]; document.querySelectorAll('#poster > .col').forEach(col => { const cards=[]; col.querySelectorAll('.card').forEach(c => { const b=c.getBoundingClientRect(); cards.push({id:c.dataset.id,height:Math.round(b.height/s),heightMm:Math.round(b.height/s/MM),grow:c.classList.contains('grow')}); }); r.push({colId:col.id,widthPx:Math.round(col.getBoundingClientRect().width/s),widthMm:Math.round(col.getBoundingClientRect().width/s/MM),cards}); }); return r; }

  function resetLayout() { setLayout(cloneLayout(DEFAULT_LAYOUT)); setCardHeights({...DEFAULT_CARD_HEIGHTS}); setFontScaleState(DEFAULT_FONT_SCALE); setLogos([...DEFAULT_LOGOS]); setSelectedCard(null); localStorage.removeItem(LS_KEY); }
  function saveConfig() { const cfg=getFullConfig(layout,cardHeights,fontScale,logos); const b=new Blob([JSON.stringify(cfg,null,2)+'\n'],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='poster-config.json'; a.click(); URL.revokeObjectURL(u); }
  function copyConfig() { navigator.clipboard.writeText(JSON.stringify(getFullConfig(layout,cardHeights,fontScale,logos),null,2)).then(()=>alert('Config copied! Paste it to Claude.')); }
  function setFontScale(s) { setFontScaleState(parseFloat(s)||DEFAULT_FONT_SCALE); }

  useEffect(() => { window.posterAPI = { swapCards, moveCard, setColumnWidth, setCardHeight, setFontScale, getWaste, getLayout, getConfig:()=>getFullConfig(layout,cardHeights,fontScale,logos), resetLayout, saveConfig, copyConfig }; });

  function handleSwapClick(cardId, e) { e.stopPropagation(); if (!selectedCard) setSelectedCard(cardId); else if (selectedCard===cardId) setSelectedCard(null); else { swapCards(selectedCard, cardId); setSelectedCard(null); } }
  function handleDropZone(targetColId, position, e) { e.stopPropagation(); if (!selectedCard) return; moveCard(selectedCard, targetColId, position); setSelectedCard(null); }

  function handleColResize(dividerIdx, e) {
    e.preventDefault(); const handle=e.currentTarget; handle.classList.add('active');
    const targetColIdx=dividerIdx===0?0:2; const invert=dividerIdx===0?1:-1;
    const targetEl=document.getElementById(layout.columns[targetColIdx].id);
    const startX=e.clientX; const scale=currentScaleRef.current;
    const startW=targetEl.getBoundingClientRect().width/scale;
    function onMove(ev) { const dx=(ev.clientX-startX)/scale*invert; const newW=Math.max(120,(startW+dx)/MM); setLayout(prev => { const next=cloneLayout(prev); next.columns[targetColIdx].widthMm=Math.round(newW); return next; }); }
    function onUp() { document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); handle.classList.remove('active'); document.body.style.cursor=''; }
    document.body.style.cursor='col-resize'; document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
  }

  function handleRowResize(colId, cardAboveIdx, e) {
    e.preventDefault(); const handle=e.currentTarget; handle.classList.add('active');
    const col=layout.columns.find(c=>c.id===colId); const aboveId=col.cards[cardAboveIdx];
    const aboveEl=document.querySelector('[data-id="'+aboveId+'"]'); if(!aboveEl)return;
    const startY=e.clientY; const scale=currentScaleRef.current; const startH=aboveEl.getBoundingClientRect().height/scale;
    setCardHeights(prev=>({...prev,[aboveId]:startH/MM}));
    function onMove(ev) { const dy=(ev.clientY-startY)/scale; setCardHeights(prev=>({...prev,[aboveId]:Math.max(20,(startH+dy)/MM)})); }
    function onUp() { document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); handle.classList.remove('active'); document.body.style.cursor=''; }
    document.body.style.cursor='row-resize'; document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
  }

  function isCardGrow(cardId) {
    if (cardHeights[cardId] != null) return false;
    for (const col of layout.columns) {
      const idx = col.cards.indexOf(cardId); if (idx===-1) continue;
      const hasGrower = col.cards.some(cid => CARD_REGISTRY[cid]?.grow && cardHeights[cid]==null);
      if (hasGrower) return CARD_REGISTRY[cardId]?.grow || false;
      const lastFlexible = [...col.cards].reverse().find(cid => cardHeights[cid]==null);
      return cardId === lastFlexible;
    }
    return false;
  }

  function renderCard(cardId) {
    const card = CARD_REGISTRY[cardId]; if (!card) return null;
    const classes = ['card']; if (card.color) classes.push(card.color); if (isCardGrow(cardId)) classes.push('grow'); if (selectedCard===cardId) classes.push('swap-selected');
    const style = {}; if (cardHeights[cardId]!=null) style.flex='0 0 '+cardHeights[cardId]+'mm';
    return (<div key={cardId} className={classes.join(' ')} data-id={cardId} style={style}><div className="swap-handle" onClick={(e)=>handleSwapClick(cardId,e)}>&#x2725;</div><h2>{card.title}</h2>{card.body}</div>);
  }

  function renderDropZone(colId, position) {
    const visible = selectedCard !== null;
    return (<div key={'dz-'+colId+'-'+position} className={'drop-zone'+(visible?' visible':'')} onClick={(e)=>handleDropZone(colId,position,e)}>{visible && <div className="drop-zone-inner" />}</div>);
  }

  function renderColumn(col) {
    const style = col.widthMm != null ? {flex:'0 0 '+col.widthMm+'mm'} : {flex:'1.5'};
    const children = [renderDropZone(col.id, 0)];
    col.cards.forEach((cardId, i) => {
      children.push(renderCard(cardId));
      if (i < col.cards.length - 1) children.push(<div key={'row-'+col.id+'-'+i} className="divider row-resize" onMouseDown={(e)=>handleRowResize(col.id,i,e)} />);
      children.push(renderDropZone(col.id, i + 1));
    });
    return (<div key={col.id} className="col" id={col.id} style={style}>{children}</div>);
  }

  return (
    <>
      <div className="toolbar">
        <button onClick={()=>setPreview(!preview)} style={preview?{background:'#3b5a80',color:'#fff'}:{}}>{preview?'Edit':'Preview'}</button>
        {!preview && <>
          <button onClick={()=>setFontScale(Math.max(0.8,fontScale-0.1))}>A-</button>
          <button onClick={()=>setFontScale(fontScale+0.1)}>A+</button>
          <button onClick={saveConfig} title="Download poster-config.json">Save</button>
          <button onClick={copyConfig} title="Copy config JSON to clipboard">Copy Config</button>
          <button onClick={resetLayout}>Reset</button>
        </>}
      </div>

      <div className="masthead">
      <div className="header">
        <div className="header-left">
          <h1>Strong Post-Training from <span className="m">Permissive</span>, Reasoning-Dominant, Web-Scale Pretraining</h1>
          <div className="authors">Ali Elganzory<sup>1,4*</sup>, Harsh Raj<sup>2,3,4,5*</sup>, Marianna Nezhurina<sup>2,3,4,5*</sup>, Victor May<sup>4,6*</sup>, Van Khue Nguyen<sup>4,7</sup>, David Salinas<sup>1,4,5,8</sup>, Huu Nguyen<sup>3,4,5,6</sup>, Jenia Jitsev<sup>2,3,4,5</sup></div>
          <div className="aff"><sup>1</sup>University of Freiburg &nbsp; <sup>2</sup>LAION &nbsp; <sup>3</sup>Jülich Supercomputing Centre (JSC), Research Center Jülich (FZJ) &nbsp; <sup>4</sup>Open-Ψ (Open-Sci) Collective &nbsp; <sup>5</sup>OpenEuroLLM &nbsp; <sup>6</sup>Ontocord &nbsp; <sup>7</sup>École Polytechnique &nbsp; <sup>8</sup>ELLIS Institute Tübingen &nbsp; <span className="eq"><sup>*</sup>Equal contribution</span></div>
        </div>
        {logos.length > 0 && (
          <div className="header-logos">
            {logos.map((logo, i) => (<img key={i} src={logo.src} alt={logo.alt} style={{height:(logo.heightMm||28)+'mm'}} />))}
          </div>
        )}
        <div className="header-right">
          <div className="badge"><img src="logos/neurips.png" alt="NeurIPS" /><span>2026</span></div>
          <div className="qr"><img src="qr.png" alt="QR code to code repository" /><div className="ql">Code, evals &amp; checkpoints</div></div>
        </div>
      </div>
      <div className="logobar">
        {LOGO_BAR.map((l, i) => (<img key={i} src={l.src} alt={l.alt} style={{height:l.h+'mm'}} />))}
      </div>
      </div>

      <div className="poster" id="poster" ref={posterRef}>
        {layout.columns.map((col, colIdx) => {
          const elements = [];
          if (colIdx > 0) elements.push(<div key={'col-div-'+colIdx} className="divider col-resize" onMouseDown={(e)=>handleColResize(colIdx-1,e)} />);
          elements.push(renderColumn(col));
          return elements;
        })}
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PosterApp />);
</script>
</body>
</html>
